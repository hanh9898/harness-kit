name: v1 guard

on: pull_request

permissions:
  contents: read

jobs:
  v1-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - name: Install pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/v1-guard"
          "$RUNNER_TEMP/v1-guard/bin/python" -m pip install pytest==8.4.2
      - name: Check v1 structural contract and Library no-write seam
        run: |
          time "$RUNNER_TEMP/v1-guard/bin/python" -m pytest -q \
            tests/test_v1_structural_contract.py tests/test_library_read_no_write.py tests/test_library_method_pack.py
      - name: Check core and optional method pack boundaries separately
        run: |
          python3 -I tools/check_boundary.py --strict
          python3 -I tools/check_method_pack.py
