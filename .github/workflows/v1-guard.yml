name: v1 guard

on: pull_request

permissions:
  contents: read

jobs:
  v1-guard:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install pytest
        run: |
          python3 -m venv "$RUNNER_TEMP/v1-guard"
          "$RUNNER_TEMP/v1-guard/bin/python" -m pip install pytest==8.4.2
      - name: Check v1 structural contract and Library no-write seam
        run: |
          time "$RUNNER_TEMP/v1-guard/bin/python" -m pytest -q \
            tests/test_v1_structural_contract.py tests/test_library_read_no_write.py
