hốt đầu lượt không thay chốt bản Setup cuối; Evolve có thể dùng delegation còn đúng.", "Giữ nháp và dừng phần phụ thuộc. Chưa cấp quyền ghi."], ["H3", "Người quản trị project duyệt cài prerequisite `mattpocock/skills` đang thiếu.", "Setup ở Apply; host/project, exact IDs, pin nguồn/installer, paths và lockfile có trong grant. Đọc lại exact source/caller.", "Không cài; ambiguity không phải missing."], ["H4", "Người quản trị project duyệt ghi/đăng ký ba override project-local.", "Quyền đăng ký riêng, đúng ID/source/revision, caller, policy và output. H3 không thay H4.", "Không register, không báo execution-ready; pair đủ điều kiện chỉ để nháp."], ["H5", "Chủ spec duyệt spec trước `to-tickets`.", "Exact spec revision, basis, scope, acceptance và approval/policy còn hiệu lực.", "Thiếu, stale hoặc bị revoke thì chưa gọi `to-tickets`."], ["H6", "Chủ quyết định chốt lại split khi draft thay đổi thực chất.", "Đúng revision của draft, scope, tiêu chí và dependency/independence. Draft không đổi có thể reuse quyết định còn đúng.", "Giữ draft, không chuyển sang publish."], ["H7", "Người có quyền tracker cho phép publish draft vào đúng Harness tracker.", "H6 nếu cần; exact draft/payload, grant, Harness namespace/role và canonical readback.", "Không đăng, không fallback Product/local."], ["H8", "Người ủy quyền đích cấp quyền execute một effect.", "Exact effect grant, live assignment/epoch, revision, route, selection và fence tại đích.", "Không gửi; publish/dispatch không cấp quyền thực thi."], ["H9", "Người có quyền thấy và xác nhận đúng lần gửi non-atomic.", "Chỉ khi policy cho phép; Human giám sát ngay lần gửi đó. Nếu thiếu fence mà policy bắt buộc, không có đường H9.", "Dừng, không chạy nền hay tái dùng xác nhận."], ["H10", "Issuer được ủy quyền cấp hoặc thu hồi grant Library.", "Kho SQLite đích, ID/operation, exact bytes, revision, expiry; commit CAS và consume cùng transaction history.", "Issue stale giữ grant cũ; revoke trước commit chặn, sau commit không undo."], ["H11", "Respondent được chỉ định trả lời ask Inbox đúng revision.", "Actor xác thực, card active, subject/revision, exact action và thread khớp. Đồng ý chỉ chuyển request tới cổng tương ứng.", "Reply cũ/sai không duyệt; thay đổi material supersede, không mint grant."], ["H12", "Chủ Memory hoặc quản trị ACL duyệt thay đổi quyền.", "Đúng Bot/store, chủ thể, phạm vi đọc/ghi và ACL revision; sau đổi kiểm lại ở worker thật.", "Không đọc/ghi ngoài ACL; missing/sai identity là Blocked, không coi là rỗng."], ["H13", "Operator can thiệp khi đối soát `Unknown` không đủ bằng chứng.", "Agent đối soát trước ở đích gốc theo stable ID/receipt. Operator chọn giữ, thu thập bằng chứng hoặc xử lý ngoài luồng có quyền riêng.", "Không suy “chưa ghi” từ vắng record. Không retry/reassign/rollback/close; chỉ proven no-write mới xét gửi mới qua grant mới."], ["H14", "Bot owner duyệt binding mới sau khi host cũ đã dừng.", "Readback trigger cũ tắt, drain/fence, đối soát Unknown; đúng Bot/scope và binding mới đọc lại vẫn disabled.", "Không rebind, không chuyển secret/trigger/grant hoặc để hai host active."], ["H15", "Owner cho phép thử đúng effect pilot B8.", "Host/project, route, scope, dữ liệu, cách dừng và giới hạn write đã chốt. Grant effect tương ứng vẫn bắt buộc.", "Chỉ fixture/đọc nếu có quyền; không tính native pass."], ["H16", "Bot operator duyệt bật một trigger cụ thể.", "Manual và fresh-worker qualification; exact trigger/Bot/scope, grant và readback từng ID.", "Trigger đó vẫn tắt; duyệt pilot, PR hoặc trigger khác không thay H16."], ["H17", "Chủ nghiệm thu quyết định closure/writeback cần thẩm quyền người.", "Caller đã verify tiêu chí bằng evidence mở được; close/writeback cần quyền riêng. Agent có thể dùng delegation còn đúng.", "Giữ Applied hoặc Verified theo evidence; không đóng hay giả nghiệm thu."], ["H18", "Repo owner duyệt PR cuối B8.", "SHA gói cuối, unit/live/perf, bốn host, blind Eval, README, diagram, blockers. Đổi material thì duyệt lại.", "Không merge B8; không cấp H15/H16."], ["H19", "Chủ đích cấp quyền apply cho bootstrap, ghi record/Glossary/ADR, cấu hình Bot disabled hoặc gửi Inbox.", "Exact grant của **từng** effect khi chưa có cổng chuyên biệt; đúng destination và readback. Opt-in hoặc H2 không cấp quyền ấy.", "Nháp inline hoặc Blocked; không ghi hay gửi."], ["H20", "Repo owner cho phép bắt đầu dây PR, và duyệt PR thay đổi hành vi/tương tác/host trước merge.", "Ghi riêng go và review của PR/head cụ thể; không suy tiếp từ H18 hoặc giữa hai sự kiện.", "Không bắt đầu nếu thiếu go; PR cần review giữ mở."]], "title": "Harness v1 · Swimlane theo skill", "note": "Ô vàng: hành động Human. Ô xanh: Agent/Skill kiểm điều kiện, ghi đích hoặc đọc lại.", "subtitle": "6 skill lõi · 7 nhánh lượt 1 · 4 topic lượt 2 · 3 override · 1 mẫu entry tùy chọn", "initial": "01-harness-setup"}</script>
